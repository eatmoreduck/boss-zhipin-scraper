name: 功能请求
description: 提议新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述你想要的功能或改进。

  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 你遇到了什么问题或不便？
      placeholder: 例如：目前每次搜索多个关键词需要手动运行多次脚本，很繁琐...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望如何解决这个问题？
      placeholder: |
        例如：
        希望支持 --keyword 参数接受多个值，用逗号分隔：
        `python3 scripts/boss_cdp_raw.py --keyword "Java,Python,Go" --pages 5`
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案（可选）
      description: 你考虑过其他的实现方式吗？
      placeholder: 例如：也可以用配置文件指定多个关键词

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 其他相关信息或截图
      placeholder: 例如：类似工具的参考实现、使用场景说明等
